name: Data desk (nightly feeds)
on:
  schedule: [{cron: '17 4 * * *'}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: data-desk, cancel-in-progress: false}
jobs:
  feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Pull cricket data (Cricsheet)
        run: python3 source/scripts/fetch_cricket.py
      - name: Pull Laugh of the Day clips from the playlist
        run: python3 source/scripts/fetch_videos.py || echo "Video feed failed, keeping yesterday's list"
      - name: Copy venue photos from Wikimedia Commons to our own server
        run: python3 source/scripts/fetch_photos.py || echo "Photo copy failed, using Commons links"
      - name: Pull F1 data (OpenF1, Jolpica)
        run: python3 source/scripts/fetch_f1.py || echo "F1 feed failed, keeping yesterday's data"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Rebuild the site (F1 pages stay off until permission)
        run: |
          cd source && npm ci && npx astro build && rm -rf dist/f1 && cp -r dist/. .. && touch ../.nojekyll && rm -rf ../f1
      - name: Commit and publish if anything changed
        run: |
          git config user.name "Continuity Projects"; git config user.email "gavin@continuityprojects.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Data desk: nightly update" && git pull --rebase && git push)
